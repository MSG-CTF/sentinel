<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080c10"><meta name="robots" content="noindex,nofollow">
  <title>Sentinel · 관리자 로그인</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script>
</head>
<body>
  <main class="access-shell">
    <section class="identity-panel" aria-label="MSG CTF Sentinel">
      <a class="wordmark" href="/login" aria-label="Sentinel 로그인"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 7 14 2 23 7v14l-9 5-9-5V7Z M5 7l9 5 9-5M14 12v14"/></svg><span>SENTINEL</span><span class="brand-divider"></span><small>MSG CTF</small></a>
      <div class="identity-content">
        <div class="sector-label"><span>01 / OPERATIONS</span><span>CONTROL SYSTEM</span></div>
        <div class="orbital" aria-hidden="true">
          <svg class="orbital-drawing" viewBox="0 0 560 560">
            <defs><radialGradient id="core-light"><stop offset="0" stop-color="#71e9da" stop-opacity=".11"/><stop offset="1" stop-color="#71e9da" stop-opacity="0"/></radialGradient></defs>
            <circle cx="280" cy="280" r="240" fill="url(#core-light)" stroke="none"/>
            <path class="crosshair" d="M280 28v92m0 320v92M28 280h92m320 0h92"/>
            <circle class="outer-ring" cx="280" cy="280" r="218"/>
            <circle class="ticks" cx="280" cy="280" r="206"/>
            <circle class="inner-ring" cx="280" cy="280" r="178"/>
            <path class="active-arc" d="M142 167a178 178 0 0 1 232-38M418 393a178 178 0 0 1-232 38"/>
            <circle class="core-ring" cx="280" cy="280" r="137"/>
            <path class="core-shape" d="m280 202 68 39v78l-68 39-68-39v-78l68-39Zm-68 39 68 39 68-39m-68 39v78"/>
            <path class="registration" d="M95 133v-22h22m326 0h22v22M95 427v22h22m326 0h22v-22"/>
            <circle class="signal-node" cx="374" cy="129" r="4"/><circle class="signal-node" cx="186" cy="431" r="4"/>
          </svg>
          <span class="orbital-label label-top">OBSERVE</span><span class="orbital-label label-right">DETECT</span><span class="orbital-label label-bottom">RECOVER</span>
          <span class="axis-label">S / 01</span>
        </div>
        <div class="identity-caption"><p>한눈에 보고, 정확하게 대응하다</p><h1>Stay in control.</h1><span>MSG CTF 인프라 관제 시스템</span></div>
      </div>
      <div class="identity-footer"><span>SERVICE LEVEL ASSURANCE</span><span>© MSG CTF</span></div>
    </section>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="panel-corner" aria-hidden="true">SECURE ACCESS <span>↗</span></div>
      <div class="login-content">
        <div class="access-label"><span class="access-dot"></span> ADMINISTRATOR</div>
        <h2 id="login-title">관제실에 접속합니다</h2>
        <p class="login-description">관리자 계정으로 로그인하세요</p>
        <form id="login-form" method="post" action="/auth/login">
          <label for="username">아이디 <span>ACCOUNT</span></label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="관리자 아이디" required>
          <label for="password">비밀번호 <span>PASSWORD</span></label>
          <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="비밀번호 입력" required><button id="toggle-password" type="button" aria-label="비밀번호 표시" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
          <p id="caps-lock" class="caps-lock" hidden>Caps Lock이 켜져 있습니다</p>
          <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
          <button id="sign-in" class="sign-in" type="submit"><span>로그인</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
        </form>
        <div class="access-note"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 6 2v5c0 4-6 8-6 8S4 13 4 9V4l6-2Z"/><path d="m7 9 2 2 4-4"/></svg><span>승인된 관리자만 접근할 수 있습니다</span></div>
        <noscript><p class="login-error">로그인하려면 JavaScript를 켜 주세요</p></noscript>
      </div>
      <footer class="login-footer"><span>MSG CLOUD</span><span>PRIVATE CONSOLE</span></footer>
    </section>
  </main>
</body>
</html>
