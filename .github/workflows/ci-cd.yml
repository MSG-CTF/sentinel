name: Sentinel CI and AWS deployment
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, feat/real-platform-monitoring]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: dotnet test -c Release --nologo
      - run: node --test local/*.test.cjs
      - run: python3 -m unittest discover -s deploy/aws -p 'test_*.py' -v
      - name: Build tested image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$REVISION" \
            --label org.opencontainers.image.source=https://github.com/MSG-CTF/sentinel \
            --tag "msg-sentinel:$REVISION" .
          mkdir release
          docker save "msg-sentinel:$REVISION" | gzip > release/image.tar.gz
          cp deploy/aws/deploy_host.py deploy/aws/release.py release/
          python3 deploy/aws/release.py manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentinel-image-${{ github.sha }}
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  deploy:
    needs: verify
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feat/real-platform-monitoring')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-production
    concurrency:
      group: sentinel-aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sentinel-image-${{ github.sha }}
          path: release/
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: sentinel-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy and verify; restore previous version on failed activation
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          AWS_ARTIFACT_BUCKET: ${{ secrets.AWS_ARTIFACT_BUCKET }}
          AWS_DEPLOY_DOCUMENT: ${{ secrets.AWS_DEPLOY_DOCUMENT }}
          SENTINEL_PROFILE_JSON: ${{ secrets.SENTINEL_PROFILE_JSON }}
          SENTINEL_PROBE_SECRETS_JSON: ${{ secrets.SENTINEL_PROBE_SECRETS_JSON }}
        run: python3 release/release.py deploy
