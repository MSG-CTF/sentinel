name: Sentinel CI and AWS deployment
on:
  pull_request:
    branches: [dev, feat/real-platform-monitoring]
  push:
    branches: [dev, feat/real-platform-monitoring]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: dotnet test -c Release --nologo
      - run: node --test local/*.test.cjs
      - run: python3 -m unittest discover -s deploy/telemetry -p 'test_*.py' -v
      # SSM runs as root; match ownership of its mode-0600 proxy configuration.
      - run: sudo --preserve-env=SENTINEL_DOCKER_TESTS python3 -m unittest discover -s deploy/aws -p 'test_*.py' -v
        env:
          SENTINEL_DOCKER_TESTS: '1'
      - name: Build tested image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$REVISION" \
            --label org.opencontainers.image.source=https://github.com/MSG-CTF/sentinel \
            --tag "msg-sentinel:$REVISION" .
          mkdir release
          docker save "msg-sentinel:$REVISION" | gzip > release/image.tar.gz
          cp deploy/aws/deploy_host.py deploy/aws/release.py release/
          python3 deploy/aws/release.py manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-image-${{ github.sha }}
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  deploy:
    needs: verify
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feat/real-platform-monitoring')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-production
    concurrency:
      group: sentinel-aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sentinel-image-${{ github.sha }}
          path: release/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: sentinel-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy and verify; restore previous version on failed activation
        env:
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          AWS_ARTIFACT_BUCKET: ${{ secrets.AWS_ARTIFACT_BUCKET }}
          AWS_DEPLOY_DOCUMENT: ${{ secrets.AWS_DEPLOY_DOCUMENT }}
          SENTINEL_PROFILE_JSON: ${{ secrets.SENTINEL_PROFILE_JSON }}
          SENTINEL_PROBE_SECRETS_JSON: ${{ secrets.SENTINEL_PROBE_SECRETS_JSON }}
          SCHEDULER_API_TOKEN: ${{ secrets.SCHEDULER_API_TOKEN }}
          SENTINEL_WEB_CONFIG_JSON: ${{ secrets.SENTINEL_WEB_CONFIG_JSON }}
          SENTINEL_DISCORD_WEBHOOK_URL: ${{ secrets.SENTINEL_DISCORD_WEBHOOK_URL }}
          SENTINEL_OPERATIONS_JSON: ${{ secrets.SENTINEL_OPERATIONS_JSON }}
          SENTINEL_SSH_DISCORD_B64: ${{ secrets.SENTINEL_SSH_DISCORD_B64 }}
          SENTINEL_SSH_SCHEDULER_B64: ${{ secrets.SENTINEL_SSH_SCHEDULER_B64 }}
          SENTINEL_SSH_RUNTIME_B64: ${{ secrets.SENTINEL_SSH_RUNTIME_B64 }}
        run: python3 release/release.py deploy
      - name: Verify public HTTPS and administrator access
        if: vars.SENTINEL_PUBLIC_HTTPS_ENABLED == 'true'
        env:
          SENTINEL_WEB_CONFIG_JSON: ${{ secrets.SENTINEL_WEB_CONFIG_JSON }}
          SENTINEL_ADMIN_PASSWORD: ${{ secrets.SENTINEL_ADMIN_PASSWORD }}
        run: python3 release/release.py verify-web
