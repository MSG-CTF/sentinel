AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS access to an existing Sentinel host with administrator authentication
Parameters:
  HostSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  HttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref HostSecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: ACME validation and redirect to authenticated HTTPS
  HttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref HostSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Sentinel dashboard and API with administrator authentication
