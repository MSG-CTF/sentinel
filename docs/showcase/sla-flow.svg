<path d="M292 200H370" fill="none" stroke="#bd955f" stroke-width="1.8" marker-end="url(#sla-arrow)"/>
<path d="M292 304H326V200H370" fill="none" stroke="#bd955f" stroke-width="1.8" marker-end="url(#sla-arrow)"/>
<rect x="370" y="135" width="285" height="130" rx="9" fill="#34291e" stroke="#bf995f"/>
<text x="512.5" y="179" font-size="24" fill="#f4ede0" font-weight="600" text-anchor="middle">SLA / Sentinel</text>
<text x="512.5" y="212" font-size="18" fill="#c7bbae" font-weight="400" text-anchor="middle">상태 판정</text>
<text x="512.5" y="238" font-size="18" fill="#c7bbae" font-weight="400" text-anchor="middle">장애·복구 기록</text>
