<path d="M655 200H697V304H740" fill="none" stroke="#bd955f" stroke-width="1.8" marker-end="url(#sla-arrow)"/>
<rect x="740" y="52" width="300" height="88" rx="9" fill="#25211b" stroke="#655442"/>
<text x="758" y="86" font-size="19" fill="#f4ede0" font-weight="600" text-anchor="start">운영 대시보드</text>
