<rect x="740" y="260" width="300" height="88" rx="9" fill="#25211b" stroke="#655442"/>
<text x="758" y="294" font-size="19" fill="#f4ede0" font-weight="600" text-anchor="start">Prometheus → Grafana</text>
<text x="758" y="324" font-size="17" fill="#c7bbae" font-weight="400" text-anchor="start">메트릭 저장 · 조회</text>
