<text x="18" y="287" font-size="19" fill="#f4ede0" font-weight="600" text-anchor="start">노드 수집기</text>
<text x="18" y="311" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">CPU · 메모리 · 디스크</text>
<text x="18" y="333" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">K3s · Windows · 서비스 상태</text>
