<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405" role="img" aria-labelledby="title desc">
<title id="title">SLA / Sentinel 상태 수집과 알림</title>
<desc id="desc">서비스 API, Scheduler 전체 인스턴스 목록과 Runtime 상태, 노드 수집 데이터를 Sentinel이 주기적으로 확인합니다 결과는 운영 대시보드와 Discord 알림에 반영하며, Prometheus가 메트릭을 수집해 Grafana에서 조회합니다 화살표는 데이터 흐름입니다</desc>
<rect width="1120" height="405" rx="14" fill="#201b16"/>
<g transform="translate(40 24)"><g font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="sla-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#bd955f" stroke-width="1.5"/></marker></defs>
<text x="0" y="24" font-size="23" fill="#f4ede0" font-weight="600" text-anchor="start">SLA / 상시 점검</text>
<text x="1040" y="24" font-size="15" fill="#c7bbae" font-weight="400" text-anchor="end">화살표: 수집 데이터·결과</text>
<rect x="0" y="52" width="292" height="88" rx="9" fill="#25211b" stroke="#655442"/>
<text x="18" y="79" font-size="19" fill="#f4ede0" font-weight="600" text-anchor="start">서비스 API</text>
<text x="18" y="103" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">Frontend · Backend</text>
<text x="18" y="125" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">Scheduler · Broker · Runtime</text>
<rect x="0" y="156" width="292" height="88" rx="9" fill="#25211b" stroke="#655442"/>
<text x="18" y="183" font-size="19" fill="#f4ede0" font-weight="600" text-anchor="start">인스턴스 목록</text>
<text x="18" y="207" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">Scheduler 전체 목록</text>
<text x="18" y="229" font-size="16" fill="#c7bbae" font-weight="400" text-anchor="start">Runtime 상태 대조</text>
