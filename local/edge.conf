server {
    listen 8080;
    server_name _;
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","scope":"local_edge_process"}';
    }
    location / {
        proxy_pass http://frontend-internal:8080/;
        proxy_set_header Host localhost;
    }
}
server {
    listen 8081;
    server_name _;
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","scope":"local_edge_process"}';
    }
    location / {
        proxy_pass http://frontend-external:8080/;
        proxy_set_header Host localhost;
    }
}
